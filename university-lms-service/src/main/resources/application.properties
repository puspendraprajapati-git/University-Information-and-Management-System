spring.application.name=university-lms-service
server.port=8082

# Database configuration (shared university_db)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/university_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Shared JWT key with core service
jwt.secret=your-256-bit-secret-key-here-make-it-long-and-random-for-production-use

# File upload configuration for assignments & learning materials
lms.upload.dir=./uploads/lms
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
